proxy_buffering    off;
proxy_set_header   X-Real-IP $remote_addr;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header   Host $http_host;
proxy_set_header   Upgrade $http_upgrade;
proxy_set_header   Connection "upgrade";
proxy_read_timeout 86400;
proxy_http_version 1.1;

upstream komet {
  server 127.0.0.1:8080;
}

server {
  server_name komet.sandec.de;

  client_max_body_size 2000M;

  location / {
    proxy_pass http://komet;
  }

  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/komet.sandec.de/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/komet.sandec.de/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
  if ($host = komet.sandec.de) {
    return 301 https://$host$request_uri;
  } # managed by Certbot


  listen 80;
  server_name komet.sandec.de;
  return 404; # managed by Certbot
}